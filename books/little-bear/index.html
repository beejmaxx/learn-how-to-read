<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f0df" />
    <title>Little Bear — Read Along</title>
    <link rel="stylesheet" href="../shared/reader.css?v=20260830-9" />
    <link rel="stylesheet" href="../../assets/phonics/coach.css?v=20260902-3" />
  </head>
  <body>
    <header class="topbar">
      <a class="home-link" href="../../" aria-label="Back to the story shelf">← Shelf</a>
      <div class="book-heading">
        <h1>Little Bear</h1>
        <p>Else Holmelund Minarik · pictures by Maurice Sendak</p>
      </div>
      <button class="icon-button" id="fullscreenButton" type="button" aria-label="Enter full screen" title="Full screen">⛶</button>
    </header>

    <main>
      <section class="reader" aria-label="Book reader">
        <button class="page-turn previous" id="previousButton" type="button" aria-label="Previous page">‹</button>
        <div class="spread" id="pageStage" aria-live="polite">
          <article class="page-frame left-page" id="leftPage" hidden>
            <img alt="" draggable="false" />
            <div class="word-layer" aria-label="Words on the left page"></div>
          </article>
          <article class="page-frame right-page" id="rightPage">
            <img alt="" draggable="false" />
            <div class="word-layer" aria-label="Words on the right page"></div>
          </article>
        </div>
        <button class="page-turn next" id="nextButton" type="button" aria-label="Next page">›</button>
      </section>

      <aside class="phonics-coach-host reader-phonics-coach" id="wordCoach" aria-live="polite" hidden></aside>

      <nav class="reader-controls" aria-label="Reader controls">
        <div class="control-buttons">
          <button id="chaptersButton" type="button" aria-expanded="false" aria-controls="chapterPanel">☰ Chapters</button>
          <button id="readButton" type="button">▶ Read pages</button>
          <label class="auto-speak-toggle" title="Pronounce each word selected with the arrows">
            <input id="autoSpeakToggle" type="checkbox" aria-label="Speak words as I move" />
            <span class="auto-speak-text">Speak as I move</span>
          </label>
        </div>
        <label class="page-scrubber">
          <span class="sr-only">Choose a page</span>
          <input id="pageSlider" type="range" min="1" max="67" value="1" />
        </label>
        <span class="page-count" id="pageCount" aria-live="polite">1 of 67</span>
      </nav>

      <aside class="chapter-panel" id="chapterPanel" aria-label="Chapters" hidden>
        <div class="panel-heading">
          <h2>Jump to a story</h2>
          <button id="closeChaptersButton" class="icon-button" type="button" aria-label="Close chapters">×</button>
        </div>
        <div class="chapter-list" id="chapterList"></div>
      </aside>
      <button class="panel-backdrop" id="panelBackdrop" type="button" aria-label="Close chapters" hidden></button>

    </main>

    <script src="config.js?v=20260830-9"></script>
    <script src="../../assets/phonics/coach.js?v=20260902-3"></script>
    <script src="../shared/reader.js?v=20260902-3"></script>
  </body>
</html>
